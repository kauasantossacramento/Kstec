name: Deploy

# Deploy por tag (vX.Y.Z) na VPS Hetzner, após a imagem ser publicada pelo CI.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/kscentral
            git fetch --tags && git checkout ${{ github.event.workflow_run.head_branch }}
            ./scripts/deploy.sh ${{ github.event.workflow_run.head_branch }}
