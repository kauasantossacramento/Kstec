name: kscentral

x-app: &app
  image: ${KS_IMAGE:-ghcr.io/kauasantossacramento/kscentral:latest}
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file: ../.env
  restart: unless-stopped
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "4"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kscentral}
      POSTGRES_USER: ${POSTGRES_USER:-kscentral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: America/Bahia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:
  caddy_data:
  caddy_config:
