<section class="card"><div class="linha entre"><h3>Financeiro do contrato</h3><a class="btn" href="{% url 'financeiro:demonstrativo' %}?contrato={{ obj.pk }}">Demonstrativo</a></div>{% if resultado %}<p>Resultado desde o início da vigência até hoje: <strong>{{ resultado.resultado|brl }}</strong></p>{% endif %}{% for l in lancamentos %}<div class="linha entre" style="padding:12px 0;border-bottom:1px solid var(--line)"><a href="{% url 'financeiro:lancamento_detalhe' l.pk %}">{{ l }}</a><span>{{ l.valor|brl }} · {{ l.get_status_display }}</span></div>{% empty %}<p class="muted">Nenhum lançamento neste contrato.</p>{% endfor %}</section>
