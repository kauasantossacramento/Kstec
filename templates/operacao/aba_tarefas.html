<section class="card"><div class="linha entre"><h3>Tarefas do contrato</h3><div>{% if pode_criar_tarefa %}<a class="btn" href="{% url 'operacao:tarefa_nova' %}?contrato={{ obj.pk }}">Nova tarefa</a>{% endif %} <a class="btn" href="{% url 'operacao:kanban' %}?contrato={{ obj.pk }}">Quadro</a></div></div>{% for t in tarefas %}<div class="linha entre" style="padding:12px 0;border-bottom:1px solid var(--line)"><a href="{% url 'operacao:tarefa_detalhe' t.pk %}">{{ t }}</a><span>{{ t.get_status_display }} · {{ t.responsavel }}</span></div>{% empty %}<p class="muted">Nenhuma tarefa neste contrato.</p>{% endfor %}</section>
