<section class="card"><h3>{{ tipo_documento }}</h3><a class="btn btn-primario" href="{% url 'fiscal:documentos_contrato' contrato.pk %}">Preparar documentos da competência</a><table class="tabela"><thead><tr><th>Competência</th><th>Versão</th><th>Situação</th></tr></thead><tbody>{% for d in documentos %}<tr><td><a href="{% url 'fiscal:documentos_contrato' contrato.pk %}?competencia={{ d.competencia|date:'Y-m-d' }}">{{ d.competencia|date:"m/Y" }}</a></td><td>{{ d.versao }}</td><td>{{ d.get_status_display }}</td></tr>{% empty %}<tr><td colspan="3">Nenhum documento cadastrado.</td></tr>{% endfor %}</tbody></table></section>
